[project]
name = "langfuse-synth-core"
version = "1.3.0"
description = "Shared synthesis library + Authoring SDK for Demo Depot kits (Spec A, #19)."
requires-python = ">=3.11"
# Runtime deps. Ring 1 (#31) extracted a byte-identical core that is pure stdlib except
# the Langfuse client (`lfclient`, the v4 SDK). Ring 2 (#33) moved the data-model middle
# field — the config loader (`config.load_config`), which parses YAML at seed/plan/verify
# time — so `PyYAML` is now a genuine RUNTIME dep too. Both SDK deps are imported lazily,
# but declaring them keeps a bare runtime install self-sufficient.
# `jsonschema` (the schema validator) stays authoring-ONLY: it is the boundary marker the
# runtime-only job asserts is absent, so it must NEVER leak into this runtime list.
dependencies = [
    "langfuse>=4.0,<5",
    "PyYAML>=6,<7",
    # `requests` is a genuine RUNTIME dep: four runtime modules import it directly
    # (`http`, `lfread`, `seed/ingest`, `probe`) for the raw-REST read/ingest paths. Until
    # now it arrived only transitively (via `langfuse`); declaring it (Spec G · G2, #140)
    # makes a bare runtime install self-sufficient and pins the dependency we actually use.
    "requests>=2.28,<3",
]

[project.optional-dependencies]
# The authoring toolchain (synth-authoring new/validate/freeze + kit-dev skills, #27/#28/#11).
# The runtime (deployed-kit / portal) install must NEVER pull `jsonschema` — the boundary
# test asserts `import langfuse_synth_core.authoring` fails without this extra. (PyYAML is a
# runtime dep since Ring 2, so the validator inherits it — jsonschema is the sole marker.)
authoring = [
    "jsonschema>=4.18,<5",
]
# The Companion Adapter's web-server deps (Spec G · G2, #140). A companion container serves
# a live surface; these deps power the adapter's bind/health/serve shell and are the exact
# set the two kits' own `[playground]` extras already carry — migration collapses those
# onto `langfuse-synth-core[companion]`. They ride an EXTRA, never the base runtime install:
# a pure-spool kit (no companion) stays lean, and the adapter module itself imports them
# LAZILY (inside serve/mount), so `langfuse_synth_core.companion.adapter` is importable on a
# bare runtime install — the runtime-smoke CI job proves it, mirroring how core lazy-imports
# `langfuse`/`anthropic`/`openai`.
companion = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",   # FastAPI form parsing (surfaces post forms)
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
    # The companion-adapter contract suite binds a real uvicorn server and GETs its health
    # route, so the dev/test environment carries the [companion] web-server deps. (The
    # runtime-smoke job installs a BARE runtime and never gets these — that is the point:
    # it proves the adapter module imports without them.)
    "langfuse-synth-core[companion]",
]

[project.scripts]
# The authoring CLI (#27 ships `synth-authoring validate`; #28/#36 add `freeze`/`new`).
# It is namespaced `synth-authoring`, NOT `synth`, on purpose: the bare `synth` name is
# the KIT runtime console script (synth probe|plan|seed|verify|...), the portal
# integration surface (CONTRACT.md reserved-verb table; every manifest pipeline runs
# `synth <verb> --config {config}`). A console script installs regardless of extras, so
# registering `synth` here would put a competing entry point on PATH the moment a kit
# installs the lib (Ring 1, #31) and shadow the kit's pipeline. Namespacing sidesteps the
# collision entirely and keeps a clean split: `synth` runs a kit, `synth-authoring`
# authors one. (Running `synth-authoring` on a runtime-only install still raises the
# boundary ModuleNotFoundError from authoring/__init__ — but it no longer shadows `synth`.)
synth-authoring = "langfuse_synth_core.authoring.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["langfuse_synth_core*"]

[tool.setuptools.package-data]
# Ship the one versioned copy of the Contract schema as package data so `load_schema()`
# resolves it via importlib.resources on any install (source, wheel, or editable). Also
# ship the `synth-authoring new` scaffold templates (#36) the same way — they carry a
# `.tmpl` suffix so neither ruff nor pytest ever collect the emitted-kit source they hold.
# The kit-dev skills (#37) ride the same package-data channel — one version with the lib,
# so Contract, validator, and the skills that teach them can never drift. Markdown only, so
# nothing under skills/ is ever collected as test/lint source.
"langfuse_synth_core.authoring" = [
    "*.json",
    "scaffold_files/*.tmpl",
    "skills/*/SKILL.md",
    "skills/*/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly to pyflakes + pycodestyle (E/F) — the rules this code was
# written and reviewed against. Ruff's *default* select shifts as new rule families are
# stabilized, so relying on it (with a floating `ruff>=0.5,<1` pin) silently reddens CI
# on any ruff bump. Enumerating the rules decouples the lint contract from the ruff
# version; widen this set deliberately, not by an upgrade.
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
# Ring 1a (#31) extracted these modules from the gold-standard kits BYTE-FOR-BYTE — the
# whole point of the ring is that a diff proves zero behaviour change, so they must NOT
# be reformatted to the lib's 100-col rule. Waive only E501 (line length: the ROLE_PROFILES
# pricing table and the theme CSS/font blocks are intentionally wide) on the verbatim
# files. Every pyflakes rule (F: unused/undefined names, bad imports) still applies, so a
# real extraction defect — e.g. an import that doesn't resolve in the lib — still fails CI.
# Listed = the seven verbatim core files + `timegen.py` (which carries the verbatim `iso`
# primitive). Only some exceed 100 cols today; listing all of them makes the policy —
# "verbatim-extracted code is not reformatted" — explicit and re-bless-proof.
"src/langfuse_synth_core/rng.py" = ["E501"]
"src/langfuse_synth_core/pricing.py" = ["E501"]
"src/langfuse_synth_core/distributions.py" = ["E501"]
"src/langfuse_synth_core/lfclient.py" = ["E501"]
"src/langfuse_synth_core/timegen.py" = ["E501"]
"src/langfuse_synth_core/seed/events.py" = ["E501"]
"src/langfuse_synth_core/live/theme.py" = ["E501"]
"src/langfuse_synth_core/live/paths.py" = ["E501"]
# Spec G · G1 (#138) extracted the kits' shared llm.py under the same regime for its
# EXECUTABLE code (docstrings were rewritten scenario-neutral; the code is AST-identical
# to both kits), so it joins the list even though every line fits 100 cols today.
"src/langfuse_synth_core/companion/llm.py" = ["E501"]
